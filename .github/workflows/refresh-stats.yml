name: Refresh stats card

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Rebuild card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/make_stats_card.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets/stats.png)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/stats.png
            git commit -m "Refresh GitHub stats card"
            git push
          fi
